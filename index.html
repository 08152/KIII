<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine KI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        #chat {
            border: 1px solid #ccc;
            padding: 15px;
            min-height: 300px;
            margin-bottom: 15px;
        }

        input {
            width: 70%;
            padding: 12px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            cursor: pointer;
        }

        .du {
            margin-bottom: 10px;
        }

        .ki {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h1>Meine KI</h1>

    <div id="chat"></div>

    <input
        id="frage"
        type="text"
        placeholder="Schreibe etwas..."
    >

    <button onclick="senden()">Senden</button>

    <script>
        async function senden() {
            const input = document.getElementById("frage");
            const chat = document.getElementById("chat");

            const frage = input.value.trim();

            if (!frage) {
                return;
            }

            chat.innerHTML += `
                <div class="du">
                    <b>Du:</b> ${frage}
                </div>
            `;

            input.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        frage: frage
                    })
                });

                const daten = await response.json();

                chat.innerHTML += `
                    <div class="ki">
                        <b>KI:</b> ${daten.antwort}
                    </div>
                `;

            } catch (fehler) {
                chat.innerHTML += `
                    <div class="ki">
                        <b>KI:</b> Fehler beim Verbinden mit dem Server.
                    </div>
                `;
            }
        }

        document.getElementById("frage").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                senden();
            }
        });
    </script>

</body>
</html>
